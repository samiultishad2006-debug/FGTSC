@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--cd:#19212a;--c2:#232d38;--tx:#e8efec;--mu:#93a49e;--br:#35c496;--bt:#04211a;--bd:#2a3540;--am:#f0b04a;--amb:#3a2c0f;--ov:rgba(15,20,24,.88)}}
:root[data-theme="dark"]{--bg:#0f1418;--cd:#19212a;--c2:#232d38;--tx:#e8efec;--mu:#93a49e;--br:#35c496;--bt:#04211a;--bd:#2a3540;--am:#f0b04a;--amb:#3a2c0f;--ov:rgba(15,20,24,.88)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px}
#app{max-width:440px;margin:0 auto;min-height:100vh;padding:16px 16px 92px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 8px}
small{display:block;color:var(--mu);font-size:13px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.cd>div:nth-child(2){flex:1}
.tm{min-width:64px;text-align:center;font-weight:600}
.bg{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--c2)}
.bg.pr{background:var(--amb);color:var(--am)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.ch,.seg button,select,input,textarea,.btn{font:inherit;color:var(--tx)}
.ch{flex:none;border:1px solid var(--bd);background:var(--cd);padding:7px 14px;border-radius:99px;cursor:pointer}
.ch.on{background:var(--br);color:var(--bt);border-color:var(--br)}
.seg{display:flex;background:var(--c2);border-radius:99px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:99px;cursor:pointer}
.seg .on{background:var(--br);color:var(--bt)}
select,input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);margin-bottom:10px}
.btn{width:100%;border:0;background:var(--br);color:var(--bt);padding:13px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.g{background:var(--c2);color:var(--tx)}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--br);color:var(--bt);display:grid;place-items:center;font-weight:700;font-size:19px}
.nt{background:var(--br);color:var(--bt);border-radius:14px;padding:12px}
.nt small{color:inherit;opacity:.85}
.gr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gr button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:14px;padding:14px 4px;font:inherit;cursor:pointer}
.gr span{display:block;font-size:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.pl b{font-size:19px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--cd);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 10px;font:inherit;font-size:11px;cursor:pointer}
nav span{display:block;font-size:20px}nav .on{color:var(--br);font-weight:600}
table{border-collapse:collapse;font-size:12px;min-width:520px}td,th{border:1px solid var(--bd);padding:6px;vertical-align:top}
.ov{overflow-x:auto}
.ls{width:100%;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);font:inherit;cursor:pointer}
#ts{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;display:none;max-width:90%}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:22px}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ov),var(--ov)),var(--img) center/cover}
.hero{height:170px;border-radius:16px;background:var(--img) center/cover}
.qb{background:#fff;color:#111;border-radius:16px;padding:16px;text-align:center;margin-bottom:10px}.qb small{color:#444}
#qr svg{width:220px;height:220px}
.sn{border-radius:16px;padding:26px;text-align:center;background:var(--cd);border:1px solid var(--bd);margin-bottom:10px}
.sn span{display:block;font-size:52px}.sn.ok{background:#0e8f4f;color:#fff;border-color:#0e8f4f}.sn.no{background:#c62828;color:#fff;border-color:#c62828}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.calhd{text-align:center;font-size:11px;color:var(--mu);padding:4px 0}
.calday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;font-size:13px;position:relative;background:var(--cd);border:1px solid var(--bd)}
.calday.tdy{border-color:var(--br);font-weight:700}
.calday.sel{background:var(--br);color:var(--bt);border-color:var(--br)}
.calday.ev::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--am)}
.calday.sel.ev::after{background:var(--bt)}

function subv(){const t=T[S.k],v=S.sub;
const h={tc:['শিক্ষক তথ্য',t.i.map((n,i)=>`<div class="cd"><div class="av">${n[0]}</div><div><b>${n}</b><small>${t.s[i]} · ${t.n}</small></div></div>`).join('')],
cp:['ক্যাপ্টেন তালিকা',['ক্যাপ্টেন রাকিব|১১','ক্যাপ্টেন তানিয়া|১২'].map(x=>{x=x.split('|');return `<div class="cd"><div class="av">${x[0][10]}</div><div><b>${x[0]}</b><small>${x[1]} · ${t.n} · সেকশন A</small></div></div>`}).join('')],
at:['উপস্থিতি ট্র্যাকার',t.s.slice(0,4).map((s,i)=>{const v=[92,85,78,96][i];return `<div class="cd" style="display:block"><b>${s}</b> <small style="display:inline">${v}%</small><div style="height:8px;background:var(--c2);border-radius:9px;margin-top:6px"><div style="width:${v}%;height:8px;background:var(--br);border-radius:9px"></div></div></div>`}).join('')],
cl:['ক্লাব সমূহ',CLUBS.map((c,i)=>{const j=S.joined.includes(i);return `<div class="cd"><div><b>${c[0]}</b><small>${c[1]}</small></div><button class="ch ${j?'on':''}" onclick="toggleClub(${i})">${j?'যুক্ত ✓':'যোগ দিন'}</button></div>`}).join('')],
ep:['প্রোফাইল এডিট',`<input id="epn" value="${S.u.name}" placeholder="পুরো নাম">
<select id="epc">${['১১','১২'].map(c=>`<option ${c==S.c?'selected':''}>${c}</option>`).join('')}</select>
<select id="epk">${TK.map(k=>`<option value="${k}" ${k==S.k?'selected':''}>${T[k].n}</option>`).join('')}</select>
<button class="btn" onclick="saveProfile()">সেভ করুন</button>`]}[v];
return `<button class="ch" onclick="S.sub=null;draw()">← ফিরুন</button><h1 style="margin-top:12px">${h[0]}</h1>${h[1]}`}
const now=()=>new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});
const rnd=()=>Math.random().toString(36).slice(2,7).toUpperCase();
function qrsvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag(5,2)}catch(e){return `<div style="font:700 15px monospace;word-break:break-all;padding:12px">${t}</div>`}}
function add(ok,r,b){S.lg.unshift({t:now(),n:S.u.name,b:b||S.bn,ok,r,sy:!S.off})}
function chk(){if(S.rs)return toast('বাস অ্যাক্সেস বন্ধ');S.qr={tok:'TSC-B'+S.bn+'-'+rnd()+rnd()+Date.now().toString(36).toUpperCase(),bus:S.bn,exp:Date.now()+60000,used:false};S.sc=null;draw()}
function scan(){const q=S.qr,r=(ok,m)=>{S.sc=[ok,m];add(ok,m,q?q.bus:S.bn);draw()};
if(!q)return r(0,'কোনো QR নেই');
if(S.rs)return r(0,'বাস অ্যাক্সেস বন্ধ');
if(Date.now()>q.exp)return r(0,'QR-এর মেয়াদ শেষ');
if(q.used)return r(0,'QR আগেই ব্যবহার হয়েছে (কপি)');
if(S.fee!='paid')return r(0,'ফি বকেয়া');
q.used=true;r(1,'প্রবেশ অনুমোদিত')}
function byp(){S.fine+=800;S.rs=true;S.sc=null;add(0,'ফি না দিয়ে উঠেছে: জরিমানা ৳৮০০ ও অ্যাক্সেস বন্ধ');draw()}
function sync(){S.lg.forEach(l=>l.sy=true);S.off=false;draw();toast('সব ডাটা সার্ভারে সিঙ্ক হয়েছে')}
function rest(){if(!$('rr').value.trim())return toast('আগে কারণ লিখুন');S.rs=false;add(1,'অ্যাডমিন পর্যালোচনা করে অ্যাক্সেস ফেরত দিয়েছে');draw();toast('অ্যাক্সেস ফেরত দেওয়া হয়েছে')}
function sbn(n){S.bn=+n;S.qr=null;draw()}
function bus(){const s=S.bs,q=S.qr,sc=S.sc,p=S.fee=='paid';
let h=`<h1>স্মার্ট বাস</h1><div class="seg">${['চেক-ইন','স্ক্যানার','অ্যাডমিন'].map((x,i)=>`<button class="${i==s?'on':''}" onclick="S.bs=${i};draw()">${x}</button>`).join('')}</div>`;
if(s==0){
h+=`<div class="cd"><div><b>ফি অবস্থা</b><small>ডেমো: বদলে দেখুন</small></div><span class="bg ${p?'':'pr'}">${p?'পরিশোধিত':'বকেয়া'}</span><button class="ch" onclick="S.fee=S.fee=='paid'?'due':'paid';draw()">বদলান</button></div>`;
if(S.rs)h+=`<div class="nt" style="background:var(--am);color:#fff">🔴 বাস অ্যাক্সেস বন্ধ · জরিমানা ৳${S.fine}<small>অ্যাডমিন পর্যালোচনা করলে আবার চালু হবে</small></div>`;
else h+=chips([1,2,3].map(n=>[n,'বাস '+n]),S.bn,'sbn')+(q?`<div class="qb"><div id="qr">${qrsvg(q.tok)}</div><b>${q.tok}</b><small>বাকি: <span id="cd"></span> · একবারই চলবে</small></div><button class="btn g" onclick="chk()">নতুন QR নিন</button>`:'<button class="btn" onclick="chk()">বাসে চেক-ইন করুন</button>')}
if(s==1){h+=`<div class="sn ${sc?(sc[0]?'ok':'no'):''}"><span>${sc?(sc[0]?'🟢':'🔴'):'📷'}</span><b>${sc?sc[1]:'স্ক্যানের অপেক্ষায়'}</b></div><button class="btn" onclick="scan()">QR স্ক্যান করুন</button><h2></h2>
<div class="g2"><button class="btn g" onclick="S.off=!S.off;draw()">${S.off?'📴 অফলাইন':'📶 অনলাইন'}</button><button class="btn g" onclick="sync()">🔄 সিঙ্ক (${S.lg.filter(l=>!l.sy).length})</button></div>`;
if(sc&&!sc[0]&&sc[1]=='ফি বকেয়া')h+='<h2></h2><button class="btn" style="background:var(--am);color:#fff" onclick="byp()">তবুও উঠেছে: রিপোর্ট করুন</button>';
h+='<small style="margin-top:10px">ডেমো: একই QR দুইবার স্ক্যান করলে দ্বিতীয়বার লাল হবে।</small>'}
if(s==2){h+=`<div class="g2"><div class="pl"><small>সফল চেক-ইন</small><b>${S.lg.filter(l=>l.ok&&l.r=='প্রবেশ অনুমোদিত').length}</b></div><div class="pl"><small>মোট জরিমানা</small><b>৳${S.fine}</b></div></div>`;
if(S.rs)h+=`<h2>সীমাবদ্ধ শিক্ষার্থী</h2><div class="cd" style="display:block"><b>${S.u.name}</b><small>ফি না দিয়ে বাসে ওঠা · ৳${S.fine}</small><textarea id="rr" rows="2" placeholder="অ্যাক্সেস ফেরত দেওয়ার কারণ" style="margin-top:8px"></textarea><button class="btn" onclick="rest()">পর্যালোচনা করে চালু করুন</button></div>`;
h+='<h2>চেক-ইন লগ</h2>'+(S.lg.length?S.lg.slice(0,8).map(l=>`<div class="cd"><div class="tm">${l.ok?'🟢':'🔴'}<small>${l.t}</small></div><div><b>${l.n} · বাস ${l.b}</b><small>${l.r}</small></div><span class="bg">${l.sy?'সিঙ্ক':'অপেক্ষায়'}</span></div>`).join(''):'<small>এখনো কোনো চেক-ইন নেই</small>')}
return h}
function toggleClub(i){const p=S.joined.indexOf(i);if(p>-1)S.joined.splice(p,1);else S.joined.push(i);draw();toast(S.joined.includes(i)?'ক্লাবে যুক্ত হয়েছেন':'ক্লাব থেকে বের হয়েছেন')}
function saveProfile(){const n=$('epn').value.trim();if(!n)return toast('নাম লিখুন');S.u.name=n;S.c=$('epc').value;S.k=$('epk').value;S.sub=null;draw();toast('প্রোফাইল আপডেট হয়েছে')}
function cycleTheme(){const order=['system','light','dark'];S.theme=order[(order.indexOf(S.theme)+1)%3];applyTheme();draw()}
function applyTheme(){if(S.theme=='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme)}
function cal(){const y=_now.getFullYear(),m=_now.getMonth();
const first=new Date(y,m,1),startDow=first.getDay(),days=new Date(y,m+1,0).getDate();
const mn=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
let cells='';
for(let i=0;i<startDow;i++)cells+='<div></div>';
for(let d=1;d<=days;d++){const key=_ky(d),has=EVENTS[key],today=d==_now.getDate();
cells+=`<div class="calday ${has?'ev':''} ${S.calDay==key?'sel':''} ${today?'tdy':''}" onclick="S.calDay='${key}';draw()">${toBn(d)}</div>`}
const sel=S.calDay&&EVENTS[S.calDay];
const monthEvents=Object.entries(EVENTS).filter(([k])=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).sort();
return `<h1>ক্যালেন্ডার</h1><h2>${mn[m]} ${toBn(y)}</h2>
<div class="calgrid">${['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'].map(d=>`<div class="calhd">${d}</div>`).join('')}${cells}</div>
<h2>${S.calDay?'নির্বাচিত দিনের ইভেন্ট':'এই মাসের সব ইভেন্ট'}</h2>
${sel?sel.map(e=>`<div class="cd"><span class="bg">${e[0]}</span><div><b>${e[1]}</b></div></div>`).join(''):
(monthEvents.length?monthEvents.map(([k,v])=>v.map(e=>`<div class="cd" onclick="S.calDay='${k}';draw()"><div class="tm">${toBn(+k.split('-')[2])}</div><div><span class="bg">${e[0]}</span><b>${e[1]}</b></div></div>`).join('')).join(''):'<small>এই মাসে কোনো ইভেন্ট নেই</small>')}
${S.calDay?'<button class="ch" onclick="S.calDay=null;draw()">সব দেখান</button>':''}`}
const V={home,routine,acad,rooms,cal,menu};
function draw(){const a=$('app');
if(!S.u){a.innerHTML=login();return}
const N=[['home','🏠','ড্যাশবোর্ড'],['routine','📅','রুটিন'],['acad','🎓','একাডেমিক'],['rooms','🚪','রুম'],['cal','📆','ক্যালেন্ডার'],['menu','☰','মেনু']];
a.innerHTML=(S.sub?subv():V[S.tab]())+`<nav>${N.map(n=>`<button class="${S.tab==n[0]?'on':''}" onclick="S.tab='${n[0]}';S.sub=null;draw()"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`;
if(S.tab=='rooms'&&!S.sub)rl();scrollTo(0,0)}
function sd(i){S.d=+i;draw()}function ac(i){S.ex=i;S.tab='acad';S.sub=null;draw()}
function rd(i){S.rd=+i;draw()}function rtp(x){S.rt=x;draw()}function sb(x){S.sub=x;draw()}
function post(){const v=$('an').value.trim();if(!v)return toast('আগে ঘোষণা লিখুন');S.ann.unshift({b:'ক্যাপ্টেন '+S.u.name,t:v});draw();toast('ঘোষণা দেওয়া হয়েছে')}
S.chatOpen=false;
S.chat=[{from:'bot',text:'আসসালামু আলাইকুম! আমি কলেজ অ্যাপের ডেমো সহায়ক। রুটিন, পরীক্ষা, ফাঁকা রুম, ক্লাব বা নোটিশ নিয়ে জিজ্ঞেস করতে পারেন।'}];
function botReply(q){q=q.toLowerCase();
if(/রুটিন|ক্লাস/.test(q))return 'রুটিন ট্যাবে গিয়ে আপনার শ্রেণি ও ট্রেড বেছে দৈনিক বা সাপ্তাহিক রুটিন দেখতে পারবেন।';
if(/পরীক্ষা|পরিক্ষা|exam/.test(q))return 'একাডেমিক হাব ট্যাবের "পরীক্ষা" অংশে সব পরীক্ষার তারিখ পাবেন।';
if(/রুম|ওয়ার্কশপ|ফাঁকা/.test(q))return 'রুম ট্যাবে দিন ও পিরিয়ড বেছে ফাঁকা ক্লাসরুম বা ওয়ার্কশপ দেখা যায়।';
if(/ক্লাব/.test(q))return 'মেনু থেকে "ক্লাব সমূহ" তে গিয়ে পছন্দের ক্লাবে যোগ দিতে পারবেন।';
if(/শিক্ষক|স্যার|ম্যাডাম|instructor/.test(q))return 'মেনু থেকে "শিক্ষক তথ্য" তে গিয়ে ইন্সট্রাক্টরদের নাম ও বিষয় দেখতে পারবেন।';
if(/নোটিশ/.test(q))return 'একাডেমিক হাবের "নোটিশ" অংশে সব বিভাগীয় নোটিশ পাবেন।';
if(/হ্যালো|হাই|সালাম|আসসালামু/.test(q))return 'ওয়ালাইকুম আসসালাম! কী জানতে চান?';
return 'এই প্রশ্নের নির্দিষ্ট উত্তর ডেমোতে নেই। আসল অ্যাপে এটি real AI দিয়ে উত্তর দেবে। আপাতত কলেজ অফিসে যোগাযোগ করুন।'}
function toggleChat(){S.chatOpen=!S.chatOpen;renderChat()}
function sendChat(){const inp=$('chatInput'),v=inp.value.trim();if(!v)return;S.chat.push({from:'user',text:v});S.chat.push({from:'bot',text:botReply(v)});inp.value='';renderChat()}
function chatQuick(t){S.chat.push({from:'user',text:t});S.chat.push({from:'bot',text:botReply(t)});renderChat()}
function renderChat(){const w=$('chatWrap');
if(!S.chatOpen){w.innerHTML='<button id="chatFab" onclick="toggleChat()" aria-label="চ্যাটবট খুলুন">💬</button>';return}
w.innerHTML=`<div class="chatPanel">
<div class="chatHead"><b>🎓 কলেজ সহায়ক (ডেমো)</b><button class="chX" onclick="toggleChat()">✕</button></div>
<div class="chatBody" id="chatBody">${S.chat.map(m=>`<div class="cb ${m.from}">${m.text}</div>`).join('')}</div>
<div class="row" style="padding:0 10px">${['রুটিন','পরীক্ষা','ফাঁকা রুম','নোটিশ'].map(t=>`<button class="ch" onclick="chatQuick('${t}')">${t}</button>`).join('')}</div>
<div class="chatIn"><input id="chatInput" placeholder="প্রশ্ন লিখুন..." onkeydown="if(event.key=='Enter')sendChat()"><button class="btn" style="width:auto;padding:10px 16px" onclick="sendChat()">➤</button></div>
</div>`;
const b=$('chatBody');if(b)b.scrollTop=b.scrollHeight}
applyTheme();
draw();
renderChat();
</script></body></html>
